{% extends "print.html" %} {% block page %}

<div class="row">
  <div class="" id="vue">
    {% for page in link %}
    <page size="A4" id="pdfprint">
      {% for one in page %}
      <div class="wrapper">
        <img class="lnurlw_design" src="{{custom_url}}" alt="..." />
        <div v-if="expiry" class="amount expiry text-right">
          <span>{{ amt }} sats</span>
          <br />
          <span style="font-size: 0.7em; top: -1.4mm; position: relative"
            >Valid until {{ expiry }}</span
          >
        </div>
        <span v-else class="amount text-right">{{ amt }} sats</span>
        <div class="lnurlw">
          <lnbits-qrcode
            :value="theurl + '/?lightning={{one}}'"
            :show-buttons="false"
            :options="{width: 150}"
          ></lnbits-qrcode>
        </div>
      </div>
      {% endfor %}
    </page>
    {% endfor %}
  </div>
</div>
{% endblock %} {% block styles %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400');
  :root {
    --qr-top: 3mm;
    --qr-left: 8mm;
  }
  body {
    background: rgb(204, 204, 204);
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  page {
    background: white;
    display: block;
    margin: 0 auto;
    margin-bottom: 0.5cm;
    box-shadow: 0 0 0.5cm rgba(0, 0, 0, 0.5);
  }
  page[size='A4'] {
    width: 21cm;
    height: 29.7cm;
  }
  .wrapper {
    position: relative;
    margin-bottom: 1rem;
    padding: 1rem;
    width: fit-content;
  }
  .wrapper .amount {
    display: block;
    position: absolute;
    font-family: 'Inter';
    font-size: 0.8rem;
    color: #fff;
    top: calc(2.8mm + 1rem);
    right: calc(4mm + 1rem);

    &.expiry {
      top: calc(0.7mm + 1rem);
    }
  }

  .wrapper img.lnurlw_design {
    display: block;
    width: 187mm;
    height: auto;
  }

  .wrapper .lnurlw {
    display: block;
    position: absolute;
    top: calc(var(--qr-top) + 1rem);
    left: calc(var(--qr-left) + 1rem);
    transform: rotate(-45deg);
    width: 27mm;
  }

  @media print {
    body,
    page {
      margin: 0px !important;
      box-shadow: none !important;
    }
    .q-page,
    .wrapper {
      padding: 0px !important;
    }
    .wrapper .amount {
      top: 2.8mm;
      right: 4mm;

      &.expiry {
        top: 0.7mm;
      }
    }
    .wrapper .lnurlw {
      top: var(--qr-top);
      left: var(--qr-left);
    }
  }
</style>
{% endblock %} {% block scripts %}
<script>
  window.app = Vue.createApp({
    el: '#vue',
    data: function () {
      return {
        theurl: location.protocol + '//' + location.host,
        printDialog: {
          show: true,
          data: null
        },
        links: [],
        expiry: false
      }
    },
    created() {
      this.links = '{{ link | tojson }}'
      if ('{{ expiry }}' !== 'None') {
        this.expiry = true
      }
    }
  })
</script>
{% endblock %}
